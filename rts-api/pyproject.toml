[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rtsapi"]

[project]
name = "rts-api"
version = "2.0.0"
description = "Robotic Total Station Network API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "trajectopy>=2.2.3",
    "trajectory-sync>=0.1.0",
]

[project.optional-dependencies]
scripts = ["matplotlib>=3.10.0", "requests>=2.32.3"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "websockets>=14"]

[project.scripts]
rtsapi = "rtsapi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
