services:
  worker:
    build: .
    environment:
      - API_HOST=${API_HOST:-192.168.0.101}
      - API_PORT=${API_PORT:-8000}
      # CSV logs and the outbox (unsent measurements) shared by all workers of this device
      - MEASUREMENT_LOG_DIR=/data/measurements
    volumes:
      - ./measurements:/data/measurements
    # Host networking so the API fallback scan sees the real LAN instead of the Docker bridge subnet
    network_mode: host
    privileged: true
    restart: always
    stop_grace_period: 30s  # lets a running job end cleanly
