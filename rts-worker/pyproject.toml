[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rtsworker"]

[project]
name = "rts-worker"
version = "2.0.0"
description = "Worker of the RTS Network: controls a Leica total station and uploads its measurements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jeepney>=0.9.0",
    "pydantic>=2.10.5",
    "pyserial>=3.5",
    "requests>=2.32.3",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
rtsworker = "main:main"
