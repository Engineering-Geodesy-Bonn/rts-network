services:
  rtsapi:
    build:
      context: ./rts-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/database.db
    volumes:
      - rtsapi-data:/data
    restart: always
  rtsdashboard:
    build:
      context: ./rts-dashboard
    ports:
      - "8050:8050"
    depends_on:
      - rtsapi
    restart: always

volumes:
  rtsapi-data:
