services:
  rtsapi:
    build:
      context: ./rts-api
    ports:
      - "8000:8000"
    environment:
      - RTS_DB_PATH=/data/rtsnet.db
      - RTS_LEGACY_DB=/data/database.db  # v1 database, imported once on the first start
    volumes:
      - ./data/rts-api:/data
    restart: always
    stop_grace_period: 30s
  rtsdashboard:
    build:
      context: ./rts-dashboard
    ports:
      - "8050:8050"
    depends_on:
      - rtsapi
    restart: always
