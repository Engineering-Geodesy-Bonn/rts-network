name: Android app

on:
  push:
    paths:
      - "rts-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle -p rts-android assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: rts-dashboard-apk
          path: rts-android/app/build/outputs/apk/release/*.apk
